<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tree Hierarchy Text Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap');

  * { box-sizing: border-box; font-family: 'Roboto', sans-serif; }

  /* Use dvh to adjust natively when mobile keyboards open */
  body, html {
    background-color: #0f172a;
    color: #f8fafc;
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh; 
    overflow: hidden;
  }

  .container {
    width: 100%;
    height: 100%;
    background: #1e293b;
    display: flex;
    flex-direction: column;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    z-index: 10;
    flex-shrink: 0; /* Prevent toolbar from squishing */
  }

  .toolbar button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #f8fafc;
    background: #334155;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .toolbar button:hover { background: #3f5165; }
  .toolbar button:active { background: #29394d; }
  .toolbar button.danger { border-color: #7f1d1d; }
  .toolbar button.danger:hover { background: #4c1d1d; }
  .toolbar button.active {
    background: #0284c7;
    border-color: #38bdf8;
    color: #ffffff;
  }

  .editor-wrap {
    position: relative;
    width: 100%;
    flex-grow: 1;
    overflow: hidden;
    touch-action: pan-x pan-y; /* Allow manual pan/scroll while handling custom gestures */
  }

  .editor, .editor-overlay {
    width: 100%;
    height: 100%;
    margin: 0;
    font-family: 'Roboto', sans-serif;
    font-size: var(--editor-font-size, 14px);
    line-height: 2;            
    letter-spacing: 0;
    font-variant-ligatures: none;
    -webkit-font-feature-settings: "liga" 0, "calt" 0;
    font-feature-settings: "liga" 0, "calt" 0;
    tab-size: 8;
    padding: 18px 16px;
    border-radius: 0;
    white-space: pre;
    box-sizing: border-box;
  }

  .editor {
    position: absolute;
    top: 0; left: 0;
    z-index: 2;
    color: transparent;
    caret-color: #f8fafc;
    background-color: transparent;
    border: none;
    overflow-x: auto;
    overflow-y: auto;
    resize: none;
  }

  .editor:focus { outline: none; }

  .editor-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    background-color: #0f172a;
    overflow: hidden;
    pointer-events: none;
  }

  .overlay-content {
    position: absolute;
    top: 0; left: 0;
    color: #f8fafc;
  }

  .node-bubble {
    position: absolute;
    border: 1px solid #94a3b8;
    border-radius: 10px;
    background-color: rgba(148, 163, 184, 0.10);
    transition: background-color 0.1s;
  }

  .node-bubble.active-node {
    background-color: rgba(56, 189, 248, 0.2); 
    border-color: #38bdf8;
  }

  .node-bubble.assumption {
    border-color: #f472b6;
    background-color: rgba(244, 114, 182, 0.18);
  }

  .node-bubble.active-node.assumption {
    background-color: rgba(244, 114, 182, 0.4);
  }
  
  .fold-indicator {
    position: absolute;
    right: -16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.8em;
    color: #38bdf8;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    display: none;
    justify-content: center;
    align-items: center;
  }
  .modal {
    background: #1e293b;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #334155;
    width: 300px;
    max-width: 90%;
  }
  .modal h3 { margin-top: 0; }
  .modal button, .modal select { width: 100%; margin-top: 10px; padding: 8px; }

  @media (max-width: 768px) {
    .toolbar { display: none; }
    .toolbar.visible { display: flex; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="toolbar" id="toolbar">
    <button id="openBtn" type="button">Open / Save</button>
    <button id="importExportBtn" type="button">Import / Export</button>
    <button id="inspireBtn" type="button">Inspire ✨</button>
    <button id="undoBtn" type="button">Undo</button>
    <button id="redoBtn" type="button">Redo</button>
    <button id="newParentBtn" type="button">New Parent</button>
    <button id="newChildBtn" type="button">New Child</button>
    <button id="foldBtn" type="button">Fold / Unfold</button>
    <button id="deleteNodeBtn" type="button" class="danger">Delete</button>
    <button id="deletePromoteBtn" type="button" class="danger">Promote</button>
    <button id="moveUpBtn" type="button">Up</button>
    <button id="moveDownBtn" type="button">Down</button>
  </div>

  <div class="editor-wrap" id="editorWrap">
    <textarea id="editor" class="editor" spellcheck="false"></textarea>
    <div id="overlay" class="editor-overlay" aria-hidden="true">
      <div id="overlay-content" class="overlay-content"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <h3>Save / Load</h3>
    <select id="savedList"></select>
    <button id="loadDocBtn">Load Selected</button>
    <button id="saveDocBtn">Save Current (New)</button>
    <button id="deleteDocBtn" class="danger">Delete Selected</button>
    <button id="closeModalBtn">Cancel</button>
  </div>
</div>

<script>
  const editor = document.getElementById('editor');
  const editorWrap = document.getElementById('editorWrap');
  const overlay = document.getElementById('overlay');
  const overlayContent = document.getElementById('overlay-content');
  const toolbar = document.getElementById('toolbar');

  const MAX_CONTENT_LENGTH = 50;   
  const INDENT_WIDTH = 12; 
  const NODE_MARK = '\u200B';      

  let inspireActive = false;
  let foldedNodes = new Set();
  let lastActiveNodeIdx = -1;
  let currentDocName = 'default';
  let currentFontSize = parseInt(localStorage.getItem('tree_zoom')) || 14;

  // Apply zoom immediately
  document.documentElement.style.setProperty('--editor-font-size', currentFontSize + 'px');

  class HistoryManager {
    constructor() {
      this.undoStack = [];
      this.redoStack = [];
      this.isTracking = true;
    }
    save(text, pos) {
      if (!this.isTracking) return;
      if (this.undoStack.length === 0 || this.undoStack[this.undoStack.length - 1].text !== text) {
        this.undoStack.push({ text, pos, folded: new Set(foldedNodes) });
        this.redoStack = [];
      }
    }
    undo(editorElem, callback) {
      if (this.undoStack.length > 1) {
        this.isTracking = false;
        this.redoStack.push(this.undoStack.pop());
        const state = this.undoStack[this.undoStack.length - 1];
        editorElem.value = state.text;
        foldedNodes = new Set(state.folded);
        editorElem.selectionStart = editorElem.selectionEnd = state.pos;
        callback();
        this.isTracking = true;
        triggerAutoSave();
      }
    }
    redo(editorElem, callback) {
      if (this.redoStack.length > 0) {
        this.isTracking = false;
        const state = this.redoStack.pop();
        this.undoStack.push(state);
        editorElem.value = state.text;
        foldedNodes = new Set(state.folded);
        editorElem.selectionStart = editorElem.selectionEnd = state.pos;
        callback();
        this.isTracking = true;
        triggerAutoSave();
      }
    }
  }
  const historyMgr = new HistoryManager();

  function triggerAutoSave() {
    localStorage.setItem('tree_doc_' + currentDocName, editor.value);
    localStorage.setItem('last_open_doc', currentDocName);
  }

  function parseLine(rawLine) {
    const unit = ' '.repeat(INDENT_WIDTH);
    let depth = 0, offset = 0;
    while (rawLine.substr(offset, INDENT_WIDTH) === unit) { depth++; offset += INDENT_WIDTH; }
    const prefixLength = offset; 
    const markerLength = rawLine[offset] === NODE_MARK ? 1 : 0;
    const contentStart = offset + markerLength; 
    const content = rawLine.substring(contentStart);
    return { depth, content, prefixLength, markerLength, contentStart, isNodeConnector: markerLength === 1 };
  }

  function parseDocument(text) {
    const rawLines = text.split('\n');
    const nodes = [];
    for (let i = 0; i < rawLines.length; i++) {
      if (rawLines[i].length === 0) continue; 
      const parsed = parseLine(rawLines[i]);
      const prevNode = nodes.length ? nodes[nodes.length - 1] : null;
      if (prevNode && prevNode.depth === parsed.depth && !parsed.isNodeConnector) {
        prevNode.content += (prevNode.content ? ' ' : '') + parsed.content;
      } else {
        nodes.push({ depth: parsed.depth, content: parsed.content, id: nodes.length });
      }
    }
    if (nodes.length === 0) nodes.push({ depth: 0, content: '?', id: 0 });
    return nodes;
  }

  function capitalizeFirst(content) {
    if (!content) return content;
    return content.charAt(0).toUpperCase() + content.slice(1);
  }

  function finalizeNode(nodes, idx) {
    const node = nodes[idx];
    if (!node) return;
    const match = node.content.match(/^([Aa],)(\s*)(.*)$/);
    if (match && node.depth > 0) node.content = `Assumption: ${match[3]}`;
    node.content = capitalizeFirst(node.content);
  }

  function wrapText(text, maxLen) {
    if (!text || text.length <= maxLen) return [text || ''];
    const words = text.split(' '), lines = [];
    let cur = '';
    for (const w of words) {
      if (!cur) {
        if (w.length > maxLen) { lines.push(w.substring(0, maxLen)); cur = w.substring(maxLen); }
        else cur = w;
      } else if (cur.length + 1 + w.length <= maxLen) cur += ' ' + w;
      else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function getSubtreeEnd(nodes, idx) {
    const depth = nodes[idx].depth;
    let j = idx + 1;
    while (j < nodes.length && nodes[j].depth > depth) j++;
    return j;
  }

  function formatTreeFromNodes(nodes) {
    const formattedLines = [], lineToNodeMap = [], rowGuides = [];
    let skipUntil = -1;

    for (let i = 0; i < nodes.length; i++) {
      if (skipUntil !== -1 && i < skipUntil) continue;
      else skipUntil = -1;

      const node = nodes[i];
      if (foldedNodes.has(i)) { skipUntil = getSubtreeEnd(nodes, i); }

      const depth = node.depth;
      const wrapped = wrapText(node.content, MAX_CONTENT_LENGTH);
      let hasLaterSibling = false;
      
      for (let j = i + 1; j < nodes.length; j++) {
        if (nodes[j].depth < depth) break;
        if (nodes[j].depth === depth) { hasLaterSibling = true; break; }
      }

      const ancestorSegs = [];
      for (let d = 1; d < depth; d++) {
        let hasLaterAncestorSibling = false;
        for (let j = i + 1; j < nodes.length; j++) {
          if (nodes[j].depth < d) break;
          if (nodes[j].depth === d) { hasLaterAncestorSibling = true; break; }
        }
        if (hasLaterAncestorSibling) ancestorSegs.push({ col: d, kind: 'through' });
      }

      for (let w = 0; w < wrapped.length; w++) {
        const isFirst = w === 0;
        formattedLines.push(' '.repeat(depth * INDENT_WIDTH) + (isFirst ? NODE_MARK : '') + wrapped[w]);
        lineToNodeMap.push({ nodeIndex: i, isFirstLine: isFirst });
        const segs = ancestorSegs.slice();
        if (depth > 0) {
          if (isFirst) segs.push({ col: depth, kind: hasLaterSibling ? 'elbow-tee' : 'elbow-corner' });
          else if (hasLaterSibling) segs.push({ col: depth, kind: 'through' });
        }
        rowGuides.push(segs);
      }

      let nextVisibleIdx = i + 1;
      if (foldedNodes.has(i)) nextVisibleIdx = skipUntil;

      if (nextVisibleIdx < nodes.length) {
        formattedLines.push('');
        lineToNodeMap.push(null); 
        const spacerSegs = [];
        const nextNode = nodes[nextVisibleIdx];
        
        for (let d = 1; d < nextNode.depth; d++) {
          let hasLaterAncestorSibling = false;
          for (let j = nextVisibleIdx + 1; j < nodes.length; j++) {
            if (nodes[j].depth < d) break;
            if (nodes[j].depth === d) { hasLaterAncestorSibling = true; break; }
          }
          if (hasLaterAncestorSibling) spacerSegs.push({ col: d, kind: 'through' });
        }
        if (nextNode.depth > 0) spacerSegs.push({ col: nextNode.depth, kind: 'through' });
        rowGuides.push(spacerSegs);
      }
    }
    return { text: formattedLines.join('\n'), nodes, lineToNodeMap, rowGuides };
  }

  function formatTree(text) { return formatTreeFromNodes(parseDocument(text)); }

  let fontMetrics = null;
  function measureText(text) {
    let probe = document.getElementById('probe-span');
    if (!probe) {
      probe = document.createElement('span');
      probe.id = 'probe-span';
      probe.style.position = 'absolute';
      probe.style.visibility = 'hidden';
      probe.style.whiteSpace = 'pre';
      document.body.appendChild(probe);
    }
    const cs = getComputedStyle(editor);
    probe.style.fontFamily = cs.fontFamily;
    probe.style.fontSize = cs.fontSize;
    probe.textContent = text || 'a';
    return probe.getBoundingClientRect().width; 
  }

  function computeFontMetrics() {
    const cs = getComputedStyle(editor);
    return { lineHeight: parseFloat(cs.lineHeight), paddingLeft: parseFloat(cs.paddingLeft), paddingTop: parseFloat(cs.paddingTop) };
  }

  function computeNodeBoxes(formatted) {
    const lines = formatted.text.split('\n');
    const { lineToNodeMap, nodes } = formatted;
    const boxes = [];
    let i = 0;

    while (i < lines.length) {
      const mapInfo = lineToNodeMap[i];
      if (!mapInfo) { i++; continue; }
      const nodeIndex = mapInfo.nodeIndex;
      const node = nodes[nodeIndex];
      if (!node) { i++; continue; }

      let j = i, startCol = null, maxPxWidth = 0, hasContent = false;
      while (j < lines.length && lineToNodeMap[j] && lineToNodeMap[j].nodeIndex === nodeIndex) {
        const parsed = parseLine(lines[j]);
        if (startCol === null) startCol = parsed.prefixLength;
        if (parsed.content.length > 0) {
            hasContent = true;
            maxPxWidth = Math.max(maxPxWidth, measureText(parsed.content));
        } else if (!hasContent) {
            maxPxWidth = measureText(' '.repeat(18));
            hasContent = true; 
        }
        j++;
      }
      
      let textOverlayContent = '';
      for(let k=i; k<j; k++) textOverlayContent += (k>i?'\n':'') + parseLine(lines[k]).content;

      boxes.push({ 
        nodeIndex, lineStart: i, lineCount: j - i, 
        prefixPxWidth: measureText(' '.repeat(startCol)), 
        maxPxWidth, isAssumption: node.content.startsWith('Assumption:'),
        isFolded: foldedNodes.has(nodeIndex),
        textOverlayContent
      });
      i = j;
    }
    return boxes;
  }

  function syncOverlayScroll() { overlayContent.style.transform = `translate(${-editor.scrollLeft}px, ${-editor.scrollTop}px)`; }
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function renderOverlay(formatted) {
    if (!fontMetrics) fontMetrics = computeFontMetrics();
    const { lineHeight, paddingLeft, paddingTop } = fontMetrics;
    overlayContent.innerHTML = '';
    const frag = document.createDocumentFragment();

    computeNodeBoxes(formatted).forEach(b => {
      const div = document.createElement('div');
      div.className = 'node-bubble' + (b.isAssumption ? ' assumption' : '') + (b.nodeIndex === lastActiveNodeIdx ? ' active-node' : '');
      div.style.left = (paddingLeft + b.prefixPxWidth - 12) + 'px'; 
      div.style.top = (paddingTop + b.lineStart * lineHeight - 4) + 'px';
      div.style.width = (b.maxPxWidth + 24) + 'px'; 
      div.style.height = (b.lineCount * lineHeight - 3 + 8) + 'px'; 
      
      const txt = document.createElement('div');
      txt.style.position = 'absolute';
      txt.style.left = '12px'; txt.style.top = '4px';
      txt.textContent = b.textOverlayContent;
      div.appendChild(txt);

      if (b.isFolded) {
        const foldInd = document.createElement('div');
        foldInd.className = 'fold-indicator';
        foldInd.textContent = '▶';
        div.appendChild(foldInd);
      }
      frag.appendChild(div);
    });

    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('width', paddingLeft * 2 + 3000); 
    svg.setAttribute('height', paddingTop * 2 + formatted.rowGuides.length * lineHeight);
    svg.style.position = 'absolute'; svg.style.left = '0'; svg.style.top = '0'; svg.style.overflow = 'visible';

    const mkLine = (x1, y1, x2, y2) => {
      const l = document.createElementNS(SVG_NS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', '#64748b'); l.setAttribute('stroke-width', '1.5'); l.setAttribute('stroke-linecap', 'round');
      svg.appendChild(l);
    };

    formatted.rowGuides.forEach((segs, row) => {
      const yTop = paddingTop + row * lineHeight, yMid = yTop + lineHeight / 2, yBottom = yTop + lineHeight;
      segs.forEach(seg => {
        const colStartX = paddingLeft + measureText(' '.repeat((seg.col - 1) * INDENT_WIDTH));
        const trunkX = colStartX + measureText(' '.repeat(3)); 
        const armEndX = paddingLeft + measureText(' '.repeat(seg.col * INDENT_WIDTH)) - 14; 
        
        if (seg.kind === 'through') mkLine(trunkX, yTop, trunkX, yBottom);
        else if (seg.kind === 'elbow-tee') { mkLine(trunkX, yTop, trunkX, yMid); mkLine(trunkX, yMid, armEndX, yMid); mkLine(trunkX, yMid, trunkX, yBottom); }
        else if (seg.kind === 'elbow-corner') { mkLine(trunkX, yTop, trunkX, yMid); mkLine(trunkX, yMid, armEndX, yMid); }
      });
    });

    frag.appendChild(svg); overlayContent.appendChild(frag); syncOverlayScroll();
  }

  function applyFormatted(formatted) { editor.value = formatted.text; renderOverlay(formatted); }

  let scrollTimeout;
  editor.addEventListener('scroll', () => {
    syncOverlayScroll();
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
        localStorage.setItem('last_scroll_left_' + currentDocName, editor.scrollLeft);
        localStorage.setItem('last_scroll_top_' + currentDocName, editor.scrollTop);
    }, 200);
  });

  window.addEventListener('resize', () => { fontMetrics = null; renderOverlay(formatTree(editor.value)); });

  // Update Font Size function for gestures
  function updateFontSize(newSize) {
    const clamped = Math.max(8, Math.min(48, Math.round(newSize)));
    if (clamped === currentFontSize) return;
    currentFontSize = clamped;
    document.documentElement.style.setProperty('--editor-font-size', currentFontSize + 'px');
    localStorage.setItem('tree_zoom', currentFontSize);
    fontMetrics = null; 
    renderOverlay(formatTree(editor.value));
  }

  // 1. MOUSE WHEEL / TRACKPAD ZOOM (Ctrl + Scroll)
  editorWrap.addEventListener('wheel', (e) => {
    if (e.ctrlKey) {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 1 : -1;
      updateFontSize(currentFontSize + delta);
    }
  }, { passive: false });

  // 2. TOUCH PINCH-TO-ZOOM GESTURES
  let initialPinchDistance = null;
  let initialPinchFontSize = currentFontSize;

  function getDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  editorWrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      initialPinchDistance = getDistance(e.touches);
      initialPinchFontSize = currentFontSize;
    }
  }, { passive: true });

  editorWrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialPinchDistance) {
      e.preventDefault(); // Prevent native browser page zoom
      const currentDist = getDistance(e.touches);
      const scale = currentDist / initialPinchDistance;
      updateFontSize(initialPinchFontSize * scale);
    }
  }, { passive: false });

  const resetPinch = () => { initialPinchDistance = null; };
  editorWrap.addEventListener('touchend', resetPinch);
  editorWrap.addEventListener('touchcancel', resetPinch);

  function getCurrentNodeAndOffset() {
    const start = editor.selectionStart, lines = editor.value.split('\n');
    let charCount = 0, currentLineIdx = 0;
    for (let i = 0; i < lines.length; i++) {
      if (start <= charCount + lines[i].length) { currentLineIdx = i; break; }
      charCount += lines[i].length + 1;
    }
    const formatted = formatTree(editor.value);
    const mapInfo = formatted.lineToNodeMap[currentLineIdx] || (currentLineIdx > 0 ? formatted.lineToNodeMap[currentLineIdx - 1] : { nodeIndex: 0 });
    const nodeIdx = mapInfo ? mapInfo.nodeIndex : 0;
    
    let contentOffset = 0;
    for (let i = 0; i < currentLineIdx; i++) {
      if (formatted.lineToNodeMap[i] && formatted.lineToNodeMap[i].nodeIndex === nodeIdx) contentOffset += parseLine(lines[i]).content.length + 1;
    }
    const curParsed = parseLine(lines[currentLineIdx] || '');
    contentOffset += Math.max(0, (start - charCount) - curParsed.contentStart);
    return { nodeIndex: nodeIdx, contentOffset, lineIndex: currentLineIdx, lineOffset: start - charCount, rawParsed: curParsed };
  }

  function restoreCursorForNode(formatted, targetNodeIdx, contentOffset) {
    const lines = formatted.text.split('\n');
    let accum = 0, targetLineIdx = 0, lineContentOffset = 0;
    for (let i = 0; i < lines.length; i++) {
      const mapInfo = formatted.lineToNodeMap[i];
      if (mapInfo && mapInfo.nodeIndex === targetNodeIdx) {
        const p = parseLine(lines[i]);
        if (contentOffset <= accum + p.content.length || i === lines.length - 1 || (formatted.lineToNodeMap[i + 1] && formatted.lineToNodeMap[i + 1].nodeIndex !== targetNodeIdx)) {
          targetLineIdx = i; lineContentOffset = Math.max(0, contentOffset - accum); break;
        }
        accum += p.content.length + 1;
      }
    }
    let pos = 0;
    for (let j = 0; j < targetLineIdx && j < lines.length; j++) pos += lines[j].length + 1;
    const targetParsed = parseLine(lines[targetLineIdx] || '');
    editor.selectionStart = editor.selectionEnd = Math.min(formatted.text.length, Math.max(0, pos + targetParsed.contentStart + Math.min(targetParsed.content.length, lineContentOffset)));
  }

  let inputTimeout;
  editor.addEventListener('input', () => {
    const state = getCurrentNodeAndOffset();
    const rawNodes = parseDocument(editor.value);
    const activeNode = rawNodes[state.nodeIndex];

    if (activeNode && activeNode.content.startsWith(' ') && state.contentOffset === 1) {
      activeNode.depth += 1;
      activeNode.content = activeNode.content.substring(1); 
      const fmt = formatTreeFromNodes(rawNodes);
      applyFormatted(fmt);
      restoreCursorForNode(fmt, state.nodeIndex, 0);
      historyMgr.save(editor.value, editor.selectionStart);
      triggerAutoSave();
      return; 
    }

    const formatted = formatTree(editor.value);
    if (formatted.text !== editor.value) {
      applyFormatted(formatted);
      restoreCursorForNode(formatted, state.nodeIndex, state.contentOffset);
      historyMgr.save(editor.value, editor.selectionStart);
      triggerAutoSave();
    } else {
      renderOverlay(formatted);
      clearTimeout(inputTimeout);
      inputTimeout = setTimeout(() => {
        historyMgr.save(editor.value, editor.selectionStart);
        triggerAutoSave();
      }, 300);
    }
  });

  function manageToolbarVisibility() {
    const state = getCurrentNodeAndOffset();
    if (document.activeElement !== editor || state.lineOffset < state.rawParsed.contentStart) {
      if(window.innerWidth < 768) toolbar.classList.remove('visible');
      editor.blur(); 
    } else {
      toolbar.classList.add('visible');
    }
  }

  document.addEventListener('selectionchange', () => {
    if (document.activeElement !== editor) return;
    const state = getCurrentNodeAndOffset();
    let nodes = parseDocument(editor.value);
    let needsApply = false, targetOffset = state.contentOffset, targetNodeIdx = state.nodeIndex;

    manageToolbarVisibility();

    if (state.nodeIndex !== lastActiveNodeIdx && lastActiveNodeIdx !== -1) {
      if (nodes[lastActiveNodeIdx] && nodes[lastActiveNodeIdx].content !== '?') { finalizeNode(nodes, lastActiveNodeIdx); needsApply = true; }
    }

    if (nodes[state.nodeIndex] && nodes[state.nodeIndex].content === '?') {
      if (state.nodeIndex === 0) {
        for (let i = 0; i < nodes.length; i++) nodes[i].depth++;
        nodes.unshift({ depth: 0, content: '?' });
        if(nodes[1]) nodes[1].content = '';
        targetNodeIdx = 1; targetOffset = 0; needsApply = true;
      } else {
        nodes[state.nodeIndex].content = '';
        nodes.splice(state.nodeIndex + 1, 0, { depth: nodes[state.nodeIndex].depth, content: '?' });
        targetNodeIdx = state.nodeIndex; targetOffset = 0; needsApply = true;
      }
    }

    const prevActiveNodeIdx = lastActiveNodeIdx;
    lastActiveNodeIdx = targetNodeIdx;

    if (needsApply) {
      const formatted = formatTreeFromNodes(nodes);
      applyFormatted(formatted);
      restoreCursorForNode(formatted, targetNodeIdx, targetOffset);
      historyMgr.save(editor.value, editor.selectionStart);
      triggerAutoSave();
    } else if (prevActiveNodeIdx !== targetNodeIdx) {
      renderOverlay(formatTreeFromNodes(nodes)); 
    }
  });

  editor.addEventListener('blur', () => {
    const nodes = parseDocument(editor.value), state = getCurrentNodeAndOffset();
    if (nodes[state.nodeIndex] && nodes[state.nodeIndex].content !== '?') finalizeNode(nodes, state.nodeIndex);
    lastActiveNodeIdx = -1;
    applyFormatted(formatTreeFromNodes(nodes));
    historyMgr.save(editor.value, editor.selectionStart);
    triggerAutoSave();
  });

  editor.addEventListener('keydown', (e) => {
    if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); historyMgr.undo(editor, () => renderOverlay(formatTree(editor.value))); return; }
    if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z') || (e.ctrlKey && e.key.toLowerCase() === 'y')) { e.preventDefault(); historyMgr.redo(editor, () => renderOverlay(formatTree(editor.value))); return; }
    
    if (editor.selectionStart !== editor.selectionEnd) return;
    const state = getCurrentNodeAndOffset(), nodes = parseDocument(editor.value), node = nodes[state.nodeIndex];
    if (!node) return;
    let modified = false;

    if (e.key === ' ' && node.content === '-' && state.contentOffset === 1) {
      e.preventDefault(); node.content = '';
      nodes.splice(state.nodeIndex + 1, 0, { depth: node.depth, content: '' });
      const fmt = formatTreeFromNodes(nodes); 
      lastActiveNodeIdx = state.nodeIndex + 1;
      applyFormatted(fmt); 
      restoreCursorForNode(fmt, lastActiveNodeIdx, 0);
      renderOverlay(fmt);
      modified = true;
    } else if (e.key === ' ' && state.lineOffset <= state.rawParsed.contentStart) {
      e.preventDefault(); finalizeNode(nodes, state.nodeIndex);
      const end = getSubtreeEnd(nodes, state.nodeIndex);
      for(let i = state.nodeIndex; i < end; i++) nodes[i].depth++;
      const fmt = formatTreeFromNodes(nodes); 
      applyFormatted(fmt); 
      restoreCursorForNode(fmt, state.nodeIndex, 0); 
      renderOverlay(fmt);
      modified = true;
    } else if (e.key === 'Enter') {
      e.preventDefault(); finalizeNode(nodes, state.nodeIndex);
      nodes.splice(state.nodeIndex + 1, 0, { depth: node.depth, content: '' });
      const fmt = formatTreeFromNodes(nodes); 
      lastActiveNodeIdx = state.nodeIndex + 1;
      applyFormatted(fmt); 
      restoreCursorForNode(fmt, lastActiveNodeIdx, 0);
      renderOverlay(fmt);
      modified = true;
    } else if (e.key === 'Tab') {
      e.preventDefault(); finalizeNode(nodes, state.nodeIndex);
      const end = getSubtreeEnd(nodes, state.nodeIndex);
      if (e.shiftKey && node.depth > 0) { for(let i=state.nodeIndex; i<end; i++) nodes[i].depth--; } 
      else if (!e.shiftKey) { for(let i=state.nodeIndex; i<end; i++) nodes[i].depth++; }
      const fmt = formatTreeFromNodes(nodes); applyFormatted(fmt); restoreCursorForNode(fmt, state.nodeIndex, state.contentOffset); renderOverlay(fmt); modified = true;
    } else if (e.key === 'Backspace' && state.contentOffset === 0 && node.depth > 0) {
      e.preventDefault(); finalizeNode(nodes, state.nodeIndex);
      const end = getSubtreeEnd(nodes, state.nodeIndex);
      for(let i=state.nodeIndex; i<end; i++) nodes[i].depth--;
      const fmt = formatTreeFromNodes(nodes); applyFormatted(fmt); restoreCursorForNode(fmt, state.nodeIndex, 0); renderOverlay(fmt); modified = true;
    }
    
    if (modified) {
        historyMgr.save(editor.value, editor.selectionStart);
        triggerAutoSave();
    }
  });

  const wrapAction = (actionFn) => () => { actionFn(); historyMgr.save(editor.value, editor.selectionStart); triggerAutoSave(); };

  document.getElementById('inspireBtn').onclick = wrapAction(() => {
    inspireActive = !inspireActive;
    document.getElementById('inspireBtn').classList.toggle('active', inspireActive);
    let nodes = parseDocument(editor.value);
    if (inspireActive) {
      const newNodes = [nodes[0] || { depth: 0, content: '?' }];
      for (let i = 1; i < nodes.length; i++) {
        if(nodes[i].content === '?') continue;
        newNodes.push(nodes[i]);
        let nextDepth = i + 1 < nodes.length ? nodes[i+1].depth : 0;
        for (let d = nodes[i].depth; d > nextDepth; d--) newNodes.push({ depth: d, content: '?' });
      }
      nodes = newNodes;
    } else {
      nodes = nodes.filter((n, i) => i === 0 || n.content.trim() !== '?');
    }
    applyFormatted(formatTreeFromNodes(nodes)); editor.focus();
  });

  document.getElementById('newParentBtn').onclick = wrapAction(() => {
    const nodes = parseDocument(editor.value), state = getCurrentNodeAndOffset();
    if (!nodes[state.nodeIndex]) return;
    const end = getSubtreeEnd(nodes, state.nodeIndex);
    for (let i = state.nodeIndex; i < end; i++) nodes[i].depth++;
    nodes.splice(state.nodeIndex, 0, { depth: nodes[state.nodeIndex].depth - 1, content: '' });
    lastActiveNodeIdx = state.nodeIndex;
    const fmt = formatTreeFromNodes(nodes); applyFormatted(fmt); restoreCursorForNode(fmt, state.nodeIndex, 0); renderOverlay(fmt); editor.focus();
  });

  document.getElementById('newChildBtn').onclick = wrapAction(() => {
    const nodes = parseDocument(editor.value), state = getCurrentNodeAndOffset();
    if (!nodes[state.nodeIndex]) return;
    nodes.splice(state.nodeIndex + 1, 0, { depth: nodes[state.nodeIndex].depth + 1, content: '' });
    lastActiveNodeIdx = state.nodeIndex + 1;
    const fmt = formatTreeFromNodes(nodes); applyFormatted(fmt); restoreCursorForNode(fmt, lastActiveNodeIdx, 0); renderOverlay(fmt); editor.focus();
  });
  
  document.getElementById('foldBtn').onclick = wrapAction(() => {
    const state = getCurrentNodeAndOffset();
    if(foldedNodes.has(state.nodeIndex)) foldedNodes.delete(state.nodeIndex);
    else foldedNodes.add(state.nodeIndex);
    const fmt = formatTree(editor.value); applyFormatted(fmt); restoreCursorForNode(fmt, state.nodeIndex, state.contentOffset); editor.focus();
  });

  document.getElementById('deleteNodeBtn').onclick = wrapAction(() => {
    const nodes = parseDocument(editor.value), state = getCurrentNodeAndOffset(), idx = state.nodeIndex;
    if (nodes.length <= 1) nodes[0].content = '?';
    else { const end = getSubtreeEnd(nodes, idx); nodes.splice(idx, end - idx); if(!nodes.length) nodes.push({depth:0, content:'?'}); }
    const fmt = formatTreeFromNodes(nodes); applyFormatted(fmt); restoreCursorForNode(fmt, Math.min(idx, nodes.length - 1), 0); editor.focus();
  });

  document.getElementById('deletePromoteBtn').onclick = wrapAction(() => {
    const nodes = parseDocument(editor.value), idx = getCurrentNodeAndOffset().nodeIndex;
    if (!nodes[idx] || nodes[idx].depth === 0) return;
    const end = getSubtreeEnd(nodes, idx); for (let i = idx + 1; i < end; i++) nodes[i].depth--;
    nodes.splice(idx, 1);
    const fmt = formatTreeFromNodes(nodes); applyFormatted(fmt); restoreCursorForNode(fmt, Math.min(idx, nodes.length - 1), 0); editor.focus();
  });

  document.getElementById('moveUpBtn').onclick = wrapAction(() => {
    const nodes = parseDocument(editor.value), idx = getCurrentNodeAndOffset().nodeIndex, end = getSubtreeEnd(nodes, idx);
    let prevStart = idx - 1; while (prevStart >= 0 && nodes[prevStart].depth > nodes[idx].depth) prevStart--;
    if (prevStart < 0 || nodes[prevStart].depth !== nodes[idx].depth) return;
    nodes.splice(prevStart, 0, ...nodes.splice(idx, end - idx));
    const fmt = formatTreeFromNodes(nodes); applyFormatted(fmt); restoreCursorForNode(fmt, prevStart, 0); editor.focus();
  });

  document.getElementById('moveDownBtn').onclick = wrapAction(() => {
    const nodes = parseDocument(editor.value), idx = getCurrentNodeAndOffset().nodeIndex, end = getSubtreeEnd(nodes, idx);
    if (end >= nodes.length || nodes[end].depth !== nodes[idx].depth) return;
    const nextEnd = getSubtreeEnd(nodes, end);
    nodes.splice(idx + (nextEnd - end), 0, ...nodes.splice(idx, end - idx));
    const fmt = formatTreeFromNodes(nodes); applyFormatted(fmt); restoreCursorForNode(fmt, idx + (nextEnd - end), 0); editor.focus();
  });

  // Save/Load logic
  document.getElementById('openBtn').onclick = () => {
    const select = document.getElementById('savedList');
    select.innerHTML = '';
    const keys = Object.keys(localStorage).filter(k => k.startsWith('tree_doc_'));
    keys.forEach(k => { 
        const opt = document.createElement('option'); 
        opt.value = k; 
        opt.textContent = k.replace('tree_doc_', '') + (k.replace('tree_doc_', '') === currentDocName ? ' (Current)' : ''); 
        select.appendChild(opt); 
    });
    document.getElementById('saveModal').style.display = 'flex';
  };
  document.getElementById('closeModalBtn').onclick = () => document.getElementById('saveModal').style.display = 'none';
  document.getElementById('saveDocBtn').onclick = () => {
    const name = prompt('Name your document:', currentDocName !== 'default' ? currentDocName : '');
    if(name) { 
        currentDocName = name;
        triggerAutoSave(); 
        document.getElementById('closeModalBtn').click(); 
    }
  };
  document.getElementById('loadDocBtn').onclick = () => {
    const val = document.getElementById('savedList').value;
    if(val) { 
        currentDocName = val.replace('tree_doc_', '');
        editor.value = localStorage.getItem(val); 
        foldedNodes.clear(); 
        applyFormatted(formatTree(editor.value)); 
        
        setTimeout(() => {
            editor.scrollLeft = localStorage.getItem('last_scroll_left_' + currentDocName) || 0;
            editor.scrollTop = localStorage.getItem('last_scroll_top_' + currentDocName) || 0;
        }, 0);
        
        localStorage.setItem('last_open_doc', currentDocName);
        document.getElementById('closeModalBtn').click(); 
    }
  };
  document.getElementById('deleteDocBtn').onclick = () => {
    const val = document.getElementById('savedList').value;
    if(val) { 
        localStorage.removeItem(val); 
        localStorage.removeItem('last_scroll_left_' + val.replace('tree_doc_', ''));
        localStorage.removeItem('last_scroll_top_' + val.replace('tree_doc_', ''));
        document.getElementById('openBtn').click(); 
    }
  };
  document.getElementById('importExportBtn').onclick = () => {
    const text = editor.value;
    navigator.clipboard.writeText(text).then(() => {
        const paste = prompt("Exported to clipboard! Paste here to Import, or click Cancel:");
        if (paste) { editor.value = paste; foldedNodes.clear(); applyFormatted(formatTree(editor.value)); triggerAutoSave(); }
    });
  };

  // Initialization & Load State
  const INITIAL_NODES = [{ depth: 0, content: '?' }];
  const savedDoc = localStorage.getItem('last_open_doc');
  
  if (savedDoc && localStorage.getItem('tree_doc_' + savedDoc)) {
      currentDocName = savedDoc;
      editor.value = localStorage.getItem('tree_doc_' + savedDoc);
      applyFormatted(formatTree(editor.value));
      setTimeout(() => {
          editor.scrollLeft = localStorage.getItem('last_scroll_left_' + currentDocName) || 0;
          editor.scrollTop = localStorage.getItem('last_scroll_top_' + currentDocName) || 0;
      }, 0);
  } else {
      applyFormatted(formatTreeFromNodes(INITIAL_NODES));
  }

  if (document.fonts && document.fonts.ready) { 
      document.fonts.ready.then(() => { fontMetrics = null; applyFormatted(formatTree(editor.value)); historyMgr.save(editor.value, 0); }); 
  } else {
      setTimeout(() => { fontMetrics = null; applyFormatted(formatTree(editor.value)); historyMgr.save(editor.value, 0); }, 200);
  }
</script>

</body>
</html>
